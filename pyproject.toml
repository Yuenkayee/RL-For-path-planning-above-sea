[project]
name = "rl-for-path-planning-above-sea"
version = "0.1.0"
description = "Dynamic-weather helicopter return-path planning with RL and classical baselines"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "gymnasium>=0.29,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "tensorboard>=2.16,<3",
  "torch>=2.2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["src/test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/test/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
